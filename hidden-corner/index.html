<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hidden Corner</title>
<meta name="description" content="Hidden Corner: privacy policy and support.">
<meta name="theme-color" content="#0e6f8f">
<link rel="icon" href="../support/hidden-corner.png">
<link rel="apple-touch-icon" href="../support/hidden-corner.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --c1:#0e6f8f; --c2:#1596bd; --cream:#fff6dc; --bg:#f3f9fb; --card:#fff; --text:#12303b; --muted:#587783; --line:#d6e9ef; --deep:#0a4d65; --shadow:rgba(14,80,110,.35); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 "Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  .hero { color:var(--cream); text-align:center; padding:calc(40px + env(safe-area-inset-top)) 16px 90px;
    background: linear-gradient(135deg, #0e6f8f 0%, #134f7d 60%, #1b3a6b 100%); }
  .hero img { width:84px; height:84px; border-radius:20px; display:block; margin:0 auto 12px; box-shadow:0 14px 28px -10px rgba(0,0,0,.5); }
  h1 { font:700 36px/1.1 "Fredoka",sans-serif; margin:0; }
  .tag { margin:8px 0 0; opacity:.9; font-weight:600; }
  main { max-width:620px; margin:-60px auto 0; padding:0 16px calc(40px + env(safe-area-inset-bottom)); display:grid; gap:14px; }
  .links a { display:flex; justify-content:space-between; align-items:center; text-decoration:none; color:var(--text); font-weight:700;
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; box-shadow:0 18px 40px -22px var(--shadow); }
  .links a::after { content:"›"; color:var(--c2); font:700 22px "Fredoka",sans-serif; }
  .links a:hover, .links a:focus-visible { border-color:var(--c2); outline:none; }
  .small { color:var(--muted); font-size:14px; text-align:center; }
  footer { text-align:center; color:var(--muted); font-size:14px; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<header class="hero">
  <img src="../support/hidden-corner.png" alt="Hidden Corner">
  <h1>Hidden Corner</h1>
  <p class="tag">Find the hidden objects · Gizli nesneleri bul</p>
</header>

<main>
  <nav class="links">
    <a href="privacy/">Privacy Policy · Gizlilik Politikası</a>
    <a href="support/">Support · Destek</a>
  </nav>
  <p class="small">Effective date / Yürürlük tarihi: 17 November 2026 · 17 Kasım 2026</p>
</main>

<footer>© 2026 Hidden Corner</footer>
</body>
</html>

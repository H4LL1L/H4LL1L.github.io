<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hidden Corner</title>
<meta name="description" content="Hidden Corner: support, privacy policy and terms.">
<meta name="theme-color" content="#0e6f8f">
<link rel="icon" href="../support/hidden-corner.png?v=2">
<link rel="apple-touch-icon" href="../support/hidden-corner.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3f9fb; --card:#fff; --text:#12303b; --muted:#587783; --line:#d6e9ef; --cream:#fff6dc; --c1:#0e6f8f; --c2:#1596bd; --deep:#0a4d65; --shadow:rgba(14,80,110,.45); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1a20; --card:#122832; --text:#e3f2f7; --muted:#8fb3bf; --line:#1f3f4c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 "Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  .hero { color:var(--cream); text-align:center; padding:calc(40px + env(safe-area-inset-top)) 16px 90px;
    background: radial-gradient(90% 70% at 15% 0%, rgba(21,150,189,.9) 0%, transparent 70%), linear-gradient(135deg, #0e6f8f 0%, #134f7d 60%, #1b3a6b 100%); }
  h1 { font:700 40px/1.1 "Fredoka",sans-serif; margin:0; }
  .tag { margin:10px 0 0; opacity:.9; font-weight:600; }
  .lang { display:inline-flex; background:rgba(255,255,255,.16); border-radius:999px; padding:4px; margin-top:22px; }
  .lang button { font:700 13px "Fredoka",sans-serif; border:0; cursor:pointer; color:var(--cream); background:transparent; padding:6px 14px; border-radius:999px; }
  .lang button[aria-pressed="true"] { background:var(--cream); color:var(--c1); }
  main { max-width:620px; margin:-70px auto 0; padding:0 16px calc(40px + env(safe-area-inset-bottom)); display:grid; gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:26px; padding:24px 22px; box-shadow:0 18px 40px -18px var(--shadow); }
  .head { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .head img { width:64px; height:64px; border-radius:16px; box-shadow:0 10px 20px -8px rgba(0,0,0,.45); }
  h2 { font:700 24px/1.1 "Fredoka",sans-serif; margin:0; color:var(--c2); }
  .head p { margin:2px 0 0; color:var(--muted); font-size:14px; font-weight:600; }
  .links { display:grid; gap:8px; }
  .links a { display:flex; justify-content:space-between; align-items:center; text-decoration:none; color:var(--text); font-weight:700;
    padding:12px 14px; border-radius:14px; border:1px solid var(--line); transition:transform .12s, border-color .12s, background .12s; }
  .links a::after { content:"›"; color:var(--c2); font:700 20px "Fredoka",sans-serif; }
  .links a:hover, .links a:focus-visible { border-color:var(--c2); transform:translateY(-1px); outline:none; }
  .small { color:var(--muted); font-size:14px; text-align:center; }
  footer { text-align:center; color:var(--muted); font-size:14px; padding-bottom:calc(32px + env(safe-area-inset-bottom)); }
  .tr { display:none; }
  html[lang="tr"] .tr { display:inline; }
  html[lang="tr"] .en { display:none; }
</style>
</head>
<body>
<header class="hero">
  <h1>Hidden Corner</h1>
  <p class="tag"><span class="en">Find the hidden objects</span><span class="tr">Gizli nesneleri bul</span></p>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-l="en" aria-pressed="true">EN</button>
    <button type="button" data-l="tr" aria-pressed="false">TR</button>
  </div>
</header>

<main>
  <section class="card">
    <div class="head">
      <img src="../support/hidden-corner.png?v=2" alt="Hidden Corner">
      <div><h2>Hidden Corner</h2><p><span class="en">Find the hidden objects</span><span class="tr">Gizli nesneleri bul</span></p></div>
    </div>
    <nav class="links">
      <a href="support/"><span class="en">Support</span><span class="tr">Destek</span></a>
      <a href="privacy/"><span class="en">Privacy Policy</span><span class="tr">Gizlilik Politikası</span></a>
      <a href="terms/"><span class="en">Terms of Use</span><span class="tr">Kullanım Koşulları</span></a>
    </nav>
  </section>
  <p class="small">Last updated / Son güncelleme: 17 November 2026 · 17 Kasım 2026</p>
</main>

<footer>© 2026 Hidden Corner</footer>

<script>
  (function () {
    var btns = document.querySelectorAll('.lang button');
    function set(l) {
      document.documentElement.lang = l;
      btns.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.l === l ? 'true' : 'false'); });
      try { localStorage.setItem('lang', l); } catch (e) {}
    }
    btns.forEach(function (b) { b.addEventListener('click', function () { set(b.dataset.l); }); });
    var l = 'en';
    try { l = localStorage.getItem('lang') || ((navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en'); } catch (e) {}
    set(l);
  })();
</script>
</body>
</html>
